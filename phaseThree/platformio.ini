

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
; Arduino is used as an ESP-IDF component.  This keeps the application APIs
; that the original project uses while still allowing native ESP-IDF and
; TensorFlow Lite Micro components in the same firmware.
framework = arduino, espidf
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts = pre:tools/camera_target.py

; The board has 16 MB flash and 8 MB octal PSRAM.  Keep these explicit so a
; stale/generated sdkconfig cannot silently select the ESP-IDF defaults.
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv

lib_deps =
    espressif/esp32-camera @ ^2.0.4
    adafruit/Adafruit GFX Library @ ^1.12.1
    adafruit/Adafruit SSD1306 @ ^2.5.15
    spaziochirale/Chirale_TensorFLowLite @ ^2.0.0

build_flags =
    -I$BUILD_DIR/config
    -I.pio/build/$PIOENV/config
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -Wno-error=old-style-declaration
    ; The published TFLM bundle also compiles optional screen drivers whose
    ; interface macros are intentionally supplied only by screen examples.
    ; They remain unreferenced and are discarded from the firmware archive.
    -Wno-error=implicit-function-declaration
    ; esp32-camera is consumed as a PlatformIO library, so its Kconfig is not
    ; merged into the ESP-IDF menu. Define the selected OV2640 and OV3660 settings here.
    -DCONFIG_OV2640_SUPPORT=1
    -DCONFIG_OV3660_SUPPORT=1
    -DCONFIG_SCCB_CLK_FREQ=100000
    -DCONFIG_SCCB_HARDWARE_I2C_PORT1=1
    -DCONFIG_CAMERA_TASK_STACK_SIZE=4096
    -DCONFIG_CAMERA_CORE0=1
    -DCONFIG_CAMERA_DMA_BUFFER_SIZE_MAX=32768

; ESP-IDF enables -Werror globally. Third-party component warnings must not
; prevent a release build; application warnings remain visible in the output.
build_unflags =
    -Werror
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
